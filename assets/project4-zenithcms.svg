<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad4)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#18181b" fill-opacity="0.95"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <rect x="250" y="10" width="300" height="22" rx="6" fill="#27272a"/>
  <text x="400" y="25" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">zenith.design / creative-showcase</text>

  <!-- Main Hero Display -->
  <rect x="24" y="60" width="450" height="415" rx="12" fill="#121215" stroke="#3f3f46" stroke-opacity="0.4"/>
  <text x="48" y="105" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="2">DIGITAL EXPERIENCE ARCHITECTURE</text>
  <text x="48" y="150" fill="#fafafa" font-family="serif" font-size="34" font-weight="bold">Beyond Boundaries.</text>
  <text x="48" y="185" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">High-touch digital storytelling powered by headless Sanity CMS and Next.js 15 App Router.</text>

  <!-- Creative Graphic Art on left -->
  <circle cx="140" cy="300" r="70" fill="url(#goldGrad)" opacity="0.8"/>
  <rect x="180" y="240" width="120" height="120" rx="20" fill="#3b82f6" opacity="0.7" transform="rotate(25 240 300)"/>
  <circle cx="340" cy="310" r="50" fill="#ec4899" opacity="0.6"/>

  <rect x="48" y="410" width="130" height="38" rx="6" fill="#fafafa"/>
  <text x="113" y="434" fill="#09090b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">View Case Study</text>

  <!-- Right CMS Editor Panel -->
  <rect x="494" y="60" width="282" height="415" rx="12" fill="#18181b" stroke="#3f3f46" stroke-opacity="0.4"/>
  <text x="516" y="92" fill="#fafafa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Headless CMS Studio</text>
  <text x="516" y="110" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Real-time collaboration enabled</text>

  <!-- CMS Document items -->
  <rect x="516" y="130" width="238" height="65" rx="8" fill="#27272a"/>
  <text x="530" y="155" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PUBLISHED</text>
  <text x="530" y="178" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12">Spring 2026 Editorial Drop</text>

  <rect x="516" y="205" width="238" height="65" rx="8" fill="#27272a"/>
  <text x="530" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DRAFT SAVED</text>
  <text x="530" y="253" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12">Interactive 3D Lookbook</text>

  <!-- Performance Badges -->
  <rect x="516" y="285" width="238" height="85" rx="8" fill="#09090b" stroke="#27272a"/>
  <text x="530" y="310" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Localization & CDN</text>
  <text x="530" y="335" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Global Edge Deployment</text>
  <text x="530" y="355" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">0.12s global average TTFB</text>

  <rect x="516" y="385" width="238" height="65" rx="8" fill="url(#goldGrad)"/>
  <text x="635" y="415" fill="#451a03" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Awwwards Site of the Day</text>
  <text x="635" y="433" fill="#78350f" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Score: 8.94 / 10 • Honoree</text>
</svg>
