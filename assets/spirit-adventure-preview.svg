<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="600" fill="url(#skyGrad)"/>

  <!-- Travel Hero Section Illustration -->
  <rect x="0" y="0" width="960" height="340" fill="#0d1b2e"/>
  
  <!-- Sun / Glow -->
  <circle cx="480" cy="140" r="70" fill="url(#goldSunset)" opacity="0.85" filter="blur(20px)"/>
  <circle cx="480" cy="140" r="50" fill="url(#goldSunset)"/>

  <!-- Mountain Silhouette Range -->
  <polygon points="60,340 260,160 420,340" fill="url(#mountain1)" opacity="0.6"/>
  <polygon points="280,340 520,130 740,340" fill="#1e3a8a" opacity="0.8"/>
  <polygon points="560,340 760,170 940,340" fill="url(#mountain2)" opacity="0.5"/>
  <polygon points="0,340 180,210 380,340" fill="#0f2b48" opacity="0.9"/>
  <polygon points="400,340 640,190 860,340" fill="#064e3b" opacity="0.9"/>

  <!-- Navbar inside mockup -->
  <rect x="30" y="20" width="900" height="50" rx="10" fill="#0b1322" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.4"/>
  <text x="60" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">SPIRIT <tspan fill="#f59e0b">ADVENTURE</tspan></text>
  <text x="500" y="50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Destinations</text>
  <text x="610" y="50" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Tour Packages</text>
  <text x="730" y="50" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">About Us</text>
  <rect x="820" y="29" width="95" height="32" rx="16" fill="url(#goldSunset)"/>
  <text x="867" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Book Tour</text>

  <!-- Hero Content inside mockup -->
  <text x="480" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">DISCOVER UNTAMED ADVENTURES</text>
  <text x="480" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Curated trekking expeditions, mountain tours, and wilderness escapes.</text>
  
  <!-- Search/Booking Pill Bar inside mockup -->
  <rect x="230" y="215" width="500" height="52" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">📍 Destination: Himalayas, Manali...</text>
  <rect x="615" y="221" width="105" height="40" rx="20" fill="#2563eb"/>
  <text x="667" y="246" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Explore</text>

  <!-- Tour Package Cards Section -->
  <rect x="0" y="340" width="960" height="260" fill="#080f1d"/>
  <text x="60" y="375" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Featured Tour Packages</text>
  <text x="60" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verified itineraries with professional guides and 24/7 WhatsApp support</text>

  <!-- Card 1 -->
  <rect x="60" y="415" width="265" height="155" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-opacity="0.5"/>
  <rect x="60" y="415" width="265" height="75" rx="12" fill="#1e3a8a"/>
  <text x="80" y="460" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Himachal Trek & Camp</text>
  <text x="80" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">5 Days • 4 Nights</text>
  <text x="80" y="540" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">From ₹12,499</text>
  <rect x="235" y="525" width="75" height="26" rx="6" fill="#22c55e"/>
  <text x="272" y="542" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Enquire</text>

  <!-- Card 2 -->
  <rect x="348" y="415" width="265" height="155" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-opacity="0.5"/>
  <rect x="348" y="415" width="265" height="75" rx="12" fill="#065f46"/>
  <text x="368" y="460" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Spiti Valley Expedition</text>
  <text x="368" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">7 Days • 6 Nights</text>
  <text x="368" y="540" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">From ₹18,999</text>
  <rect x="523" y="525" width="75" height="26" rx="6" fill="#22c55e"/>
  <text x="560" y="542" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Enquire</text>

  <!-- Card 3 -->
  <rect x="635" y="415" width="265" height="155" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-opacity="0.5"/>
  <rect x="635" y="415" width="265" height="75" rx="12" fill="#78350f"/>
  <text x="655" y="460" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Meghalaya Rainforests</text>
  <text x="655" y="515" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">6 Days • 5 Nights</text>
  <text x="655" y="540" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">From ₹15,500</text>
  <rect x="810" y="525" width="75" height="26" rx="6" fill="#22c55e"/>
  <text x="847" y="542" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Enquire</text>
</svg>
