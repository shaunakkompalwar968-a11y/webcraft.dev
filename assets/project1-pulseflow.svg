  <rect x="398" y="60" width="180" height="96" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <text x="414" y="88" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Active Users</text>
  <text x="414" y="122" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">14,290</text>
  <rect x="510" y="74" width="56" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
  <text x="538" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">+18.2%</text>

  <!-- Metric Card 3 -->
  <rect x="592" y="60" width="184" height="96" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <text x="608" y="88" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Latency / P99</text>
  <text x="608" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">42 ms</text>
  <rect x="704" y="74" width="56" height="20" rx="10" fill="#06b6d4" fill-opacity="0.15"/>
  <text x="732" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Optimal</text>

  <!-- Large Chart Card -->
  <rect x="204" y="172" width="374" height="303" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <text x="224" y="202" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Real-Time Traffic & Conversions</text>
  <text x="224" y="222" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Data streaming via WebSockets live pipeline</text>
  
  <!-- Wave Graph -->
  <path d="M224 430 L224 370 Q280 340 330 380 T430 310 T520 260 T560 250 L560 430 Z" fill="url(#chartGrad)"/>
  <path d="M224 370 Q280 340 330 380 T430 310 T520 260 T560 250" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="520" cy="260" r="5" fill="#a855f7" filter="url(#glow1)"/>
  <circle cx="560" cy="250" r="5" fill="#06b6d4" filter="url(#glow1)"/>

  <!-- Activity Feed Card -->
  <rect x="592" y="172" width="184" height="303" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <text x="608" y="202" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Events Log</text>

  <circle cx="616" cy="235" r="4" fill="#10b981"/>
  <text x="628" y="239" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11">New Pro Subscriber</text>
  <text x="628" y="253" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">2 mins ago • $149/mo</text>

  <circle cx="616" cy="285" r="4" fill="#6366f1"/>
  <text x="628" y="289" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11">API Key Provisioned</text>
  <text x="628" y="303" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">8 mins ago • US-East</text>

  <circle cx="616" cy="335" r="4" fill="#f59e0b"/>
  <text x="628" y="339" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11">High Traffic Spike</text>
  <text x="628" y="353" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">14 mins ago • 12k req/s</text>

  <circle cx="616" cy="385" r="4" fill="#06b6d4"/>
  <text x="628" y="389" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11">Cache Hit 98.4%</text>
  <text x="628" y="403" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">21 mins ago • Cloudflare</text>
</svg>
