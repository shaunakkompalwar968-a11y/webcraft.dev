<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <rect x="250" y="10" width="300" height="22" rx="6" fill="#1f2937" fill-opacity="0.6"/>
  <text x="400" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">app.pulseflow.analytics / dashboard</text>

  <!-- Sidebar -->
  <rect x="24" y="60" width="160" height="415" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <rect x="42" y="80" width="22" height="22" rx="6" fill="url(#accentGrad1)"/>
  <text x="72" y="96" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">PulseFlow</text>

  <rect x="36" y="125" width="136" height="32" rx="8" fill="#6366f1" fill-opacity="0.2"/>
  <text x="50" y="146" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ Overview</text>
  <text x="50" y="184" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">📊 Analytics</text>
  <text x="50" y="222" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">👥 Customers</text>
  <text x="50" y="260" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">💳 Subscriptions</text>
  <text x="50" y="298" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">⚙️ Settings</text>

  <!-- Metric Card 1 -->
  <rect x="204" y="60" width="180" height="96" rx="12" fill="#131d33" fill-opacity="0.7" stroke="#374151" stroke-opacity="0.3"/>
  <text x="220" y="88" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Total MRR</text>
  <text x="220" y="122" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">$48,250</text>
  <rect x="316" y="74" width="56" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
  <text x="344" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">+24.8%</text>

