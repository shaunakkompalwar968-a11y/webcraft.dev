<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2d52" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141e38" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0d1b2a" fill-opacity="0.9"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <rect x="250" y="10" width="300" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
  <text x="400" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://novastore-fashion.store / checkout</text>

  <!-- Navigation Bar -->
  <rect x="24" y="58" width="752" height="48" rx="10" fill="#16223f" fill-opacity="0.7" stroke="#334155" stroke-opacity="0.3"/>
  <text x="46" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">NOVA<tspan fill="#f43f5e">STORE</tspan></text>
  <text x="210" y="88" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Apparel</text>
  <text x="280" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Footwear</text>
  <text x="360" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Accessories</text>
  <text x="450" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sale ⚡</text>

  <!-- Cart / Checkout button -->
  <rect x="660" y="68" width="100" height="28" rx="14" fill="url(#accentGrad2)"/>
  <text x="710" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cart (3)</text>

  <!-- Product 1 -->
  <rect x="24" y="122" width="234" height="220" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-opacity="0.4"/>
  <rect x="40" y="138" width="202" height="120" rx="8" fill="#0f172a"/>
  <!-- Abstract sneaker art -->
  <path d="M60 215 C100 180, 160 170, 220 220 L190 235 L70 235 Z" fill="#f43f5e" opacity="0.8"/>
  <circle cx="110" cy="190" r="15" fill="#38bdf8" opacity="0.7"/>
  <text x="40" y="280" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CyberRunner V2 Sneakers</text>
  <text x="40" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Limited Edition Series</text>
  <text x="40" y="325" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">$189.00</text>
  <rect x="180" y="308" width="62" height="24" rx="6" fill="#334155"/>
  <text x="211" y="324" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Add +</text>

  <!-- Product 2 -->
  <rect x="282" y="122" width="234" height="220" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-opacity="0.4"/>
  <rect x="298" y="138" width="202" height="120" rx="8" fill="#0f172a"/>
  <rect x="340" y="155" width="118" height="85" rx="6" fill="#8b5cf6" opacity="0.6"/>
  <text x="298" y="280" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AeroShield Weatherproof Parka</text>
  <text x="298" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Waterproof GORE-TEX</text>
  <text x="298" y="325" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">$320.00</text>
  <rect x="438" y="308" width="62" height="24" rx="6" fill="#334155"/>
  <text x="469" y="324" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Add +</text>

  <!-- Live Checkout Summary Card -->
  <rect x="540" y="122" width="236" height="354" rx="12" fill="#16203a" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="560" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Stripe Instant Checkout</text>
  
  <rect x="560" y="172" width="196" height="42" rx="8" fill="#0d1527"/>
  <text x="572" y="192" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Subtotal (3 items)</text>
  <text x="736" y="192" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">$698.00</text>
  <text x="572" y="206" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Tax & Express Shipping: Free</text>

  <line x1="560" y1="230" x2="756" y2="230" stroke="#334155"/>

  <text x="560" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Payment Method</text>
  <rect x="560" y="270" width="196" height="38" rx="8" fill="#0d1527" stroke="#38bdf8" stroke-width="1"/>
  <text x="575" y="294" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">💳 •••• 4242 (Apple Pay)</text>

  <rect x="560" y="324" width="196" height="44" rx="8" fill="url(#accentGrad2)"/>
  <text x="658" y="351" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pay $698.00 Now</text>

  <rect x="560" y="380" width="196" height="76" rx="8" fill="#0b132b" stroke="#334155" stroke-opacity="0.5"/>
  <text x="572" y="405" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Ultra-low 90ms latency</text>
  <text x="572" y="425" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Webhook sync with Supabase</text>
  <text x="572" y="445" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 99.98% Conversion rate</text>

  <!-- Bottom stat banner -->
  <rect x="24" y="360" width="492" height="116" rx="12" fill="#121d38" stroke="#334155" stroke-opacity="0.3"/>
  <text x="44" y="392" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">E-Commerce Benchmarks</text>
  
  <text x="44" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Google PageSpeed</text>
  <text x="44" y="448" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">99 / 100</text>

  <text x="210" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cart Abandonment</text>
  <text x="210" y="448" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">-34% drop</text>

  <text x="370" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Revenue Lift</text>
  <text x="370" y="448" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">+145% YoY</text>
</svg>
