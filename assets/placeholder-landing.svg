<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="landingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#landingBg)"/>

  <!-- Left: Desktop Landing Page Layout -->
  <g transform="translate(40, 40)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="520" rx="12" fill="#0d1424" stroke="#334155" stroke-opacity="0.6"/>
    <rect width="600" height="38" rx="12" fill="#172033"/>
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>
    <rect x="180" y="8" width="240" height="22" rx="4" fill="#0d1424"/>
    <text x="300" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">landing-campaign.live</text>

    <!-- Landing Page Navbar -->
    <text x="30" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">HYPER<tspan fill="#06b6d4">CONVERT</tspan></text>
    <rect x="490" y="58" width="80" height="26" rx="13" fill="url(#cyanPurple)"/>
    <text x="530" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Get Started</text>

    <!-- Main Headline -->
    <rect x="30" y="115" width="130" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15"/>
    <text x="95" y="130" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROVEN ROI FRAMEWORK</text>

    <text x="30" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Double Your Campaign</text>
    <text x="30" y="215" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Lead Conversions.</text>

    <text x="30" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High-speed, friction-free landing page architected to turn ad traffic into paying leads.</text>

    <!-- Lead Capture Form Mockup -->
    <rect x="30" y="280" width="360" height="180" rx="10" fill="#131c2e" stroke="#1e293b"/>
    <text x="50" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Download The Growth Playbook</text>
    <rect x="50" y="325" width="320" height="34" rx="6" fill="#0b101c" stroke="#334155"/>
    <text x="65" y="347" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Enter your work email address...</text>
    <rect x="50" y="370" width="320" height="34" rx="6" fill="#0b101c" stroke="#334155"/>
    <text x="65" y="392" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Company website URL...</text>
    <rect x="50" y="415" width="320" height="34" rx="6" fill="url(#cyanPurple)"/>
    <text x="210" y="437" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Claim Free Strategy PDF →</text>

    <text x="30" y="490" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">✓ Zero layout shift • Sub-second mobile load time • Analytics integrated</text>
  </g>

  <!-- Right: Overlapping Mobile Phone Mockup -->
  <g transform="translate(670, 70)" filter="url(#phoneShadow)">
    <rect width="250" height="480" rx="36" fill="#0a0f1d" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="3"/>
    <!-- Speaker / camera notch -->
    <rect x="85" y="12" width="80" height="14" rx="7" fill="#1e293b"/>
    <circle cx="150" cy="19" r="3" fill="#06b6d4"/>

    <!-- Screen Content -->
    <rect x="15" y="36" width="220" height="428" rx="24" fill="#0f172a"/>
    <text x="30" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">HYPER<tspan fill="#06b6d4">CONVERT</tspan></text>

    <rect x="30" y="90" width="85" height="18" rx="9" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="72" y="102" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">MOBILE FIRST</text>

    <text x="30" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">High-Converting</text>
    <text x="30" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Mobile Experience</text>

    <!-- Mini form -->
    <rect x="30" y="170" width="190" height="140" rx="8" fill="#1e293b"/>
    <rect x="40" y="185" width="170" height="28" rx="4" fill="#0f172a"/>
    <text x="50" y="203" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Your Email Address</text>
    <rect x="40" y="222" width="170" height="28" rx="4" fill="#0f172a"/>
    <text x="50" y="240" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Phone / WhatsApp</text>
    <rect x="40" y="260" width="170" height="32" rx="4" fill="url(#cyanPurple)"/>
    <text x="125" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Book Demo Now</text>

    <!-- Bottom home bar -->
    <rect x="85" y="450" width="80" height="4" rx="2" fill="#475569"/>
  </g>
</svg>
